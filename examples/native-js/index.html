<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make Traffic — Native JS Example</title>
    <style>
        body { font-family: sans-serif; background: #18181b; color: #fff; max-width: 480px; margin: 40px auto; padding: 0 16px; }
        h1   { font-size: 1.4rem; margin-bottom: 16px; }
        ul   { list-style: none; padding: 0; margin: 0; background: #27272a; border-radius: 12px; overflow: hidden; }
        li.task-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #3f3f46; }
        li.task-item:last-child { border-bottom: none; }
        .task-name    { flex: 1; font-size: 0.9rem; font-weight: 500; }
        .task-rewards { font-size: 0.75rem; color: #fbbf24; }
        .task-actions button { font-size: 0.75rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; border: none; cursor: pointer; background: rgba(255,255,255,0.1); color: #fff; }
        .done  { font-size: 0.75rem; color: #4ade80; font-weight: 500; }
        #notification { display: none; position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 10px; color: #fff; font-size: 0.875rem; font-weight: 500; }
    </style>
</head>
<body>
    <h1>Tasks</h1>
    <ul id="task-list"></ul>
    <div id="notification"></div>
    <script type="importmap">
    {
        "imports": {
            "make-traffic-integration-core": "./node_modules/make-traffic-integration-core/dist/bundle.esm.js"
        }
    }
    </script>
    <script type="module" src="index.js"></script>
</body>
</html>
